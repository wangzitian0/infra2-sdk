# Canary Todo without a platform: the app, Postgres, Redis and an S3 store on one network.
# Every setting is declared once on CanarySettings (`canary_settings.py`).
#
#   docker compose -f canary/todo/compose.yaml up --build --wait
#   curl -f http://127.0.0.1:8000/api/canary/status
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: local-test-postgres
      POSTGRES_DB: todo
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "local-test-redis"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a local-test-redis --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: rustfs/rustfs:1.0.0
    command: ["--address", ":9000", "/data"]
    environment:
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
      RUSTFS_ACCESS_KEY: local-test-s3
      RUSTFS_SECRET_KEY: local-test-s3-secret
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3-init:
    # One shot: create the bucket with the SDK helper in the app image, then exit.
    build:
      context: ../..
      dockerfile: canary/todo/Dockerfile
    image: infra2-canary-todo:local
    pull_policy: never
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    environment: &s3
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: canary
      S3_ACCESS_KEY: local-test-s3
      S3_SECRET_KEY: local-test-s3-secret
    command:
      - python
      - -c
      - |
        from infra2_sdk.storage import S3Settings, create_s3_client, ensure_bucket
        s = S3Settings.from_env()
        ensure_bucket(create_s3_client(s), s.bucket, s.region)

  otlp-stub:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    restart: "no"
    ports:
      - "127.0.0.1:4318:4318"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4318/stats', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 20
    command:
      - python
      - -c
      - |
        import http.server, json
        counts = {"traces": 0, "metrics": 0, "logs": 0}
        class H(http.server.BaseHTTPRequestHandler):
            def log_message(self, *a): return
            def do_GET(self):
                if self.path == "/stats":
                    body = json.dumps(counts).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)
                else:
                    self.send_response(404); self.end_headers()
            def do_POST(self):
                n = int(self.headers.get("Content-Length") or 0)
                if n: self.rfile.read(n)
                for k, p in (("traces", "/v1/traces"), ("metrics", "/v1/metrics"), ("logs", "/v1/logs")):
                    if self.path.startswith(p): counts[k] += 1
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", "2")
                self.end_headers()
                self.wfile.write(b"{}")
        http.server.ThreadingHTTPServer(("0.0.0.0", 4318), H).serve_forever()

  db-init:
    # One shot: create the canary enum type and todos table checked by schema gate, then exit.
    image: infra2-canary-todo:local
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: "no"
    environment:
      DATABASE_URL: postgresql://todo:local-test-postgres@postgres:5432/todo
    command:
      - python
      - -c
      - |
        import os, psycopg
        from canary_schema import ENSURE_SCHEMA_SQL
        with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
            conn.execute(ENSURE_SCHEMA_SQL)

  todo:
    image: infra2-canary-todo:local
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otlp-stub:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    environment:
      <<: *s3
      ENVIRONMENT: local_test
      SERVICE_VERSION: local-standalone
      DATABASE_URL: postgresql://todo:local-test-postgres@postgres:5432/todo
      REDIS_URL: redis://:local-test-redis@redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otlp-stub:4318
      OTEL_SERVICE_NAME: platform-todo
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local_test,infra.service.id=platform/todo,service.version=local-standalone,infra.iac.ref=0000000000000000000000000000000000000000
      OTEL_METRIC_EXPORT_INTERVAL: "1000"
      STATUS_CACHE_TTL_SECONDS: "2"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
