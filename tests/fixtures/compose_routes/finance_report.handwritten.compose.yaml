# Source: wangzitian0/infra2@4dd5ed29 finance_report/finance_report/10.app/compose.yaml (verbatim after this line)
# Finance Report Production Deployment
#
# IMPORTANT: This compose file runs database migrations on container startup.
#
# Deployment Considerations:
# - Migrations run automatically before the application starts
# - Alembic uses database locks to prevent concurrent migration conflicts
# - For zero-downtime deployments, ensure migrations are backward-compatible
# - Scale backend to 1 replica during deployments to avoid migration contention
# - Use 'docker compose up -d --no-deps --scale backend=1 backend' for updates
#
# Migration Safety:
# - Failed migrations prevent container startup (fail-fast)
# - Retry logic handles transient PostgreSQL connection issues
# - Healthcheck grants a bounded 450s for migration + cold startup
#
# Runtime configuration BOTH processes that run the backend image need. The worker
# parses statements: it reads the same object store, talks to the same models, and must
# know which environment it is in. Declared once because declaring it twice is how this
# broke — #639 moved PREFECT_API_URL into this file "but only for backend", and on
# 2026-09-10 the same shape cost a release: the staging worker had no S3_BUCKET, fell
# back to the image default `statements` (production's bucket), and every statement it
# tried to parse failed with `StorageError: Failed to access bucket statements` once
# #677 scoped the staging credential to its own bucket. Production only worked because
# the default happened to be the right name there.
x-app-runtime-env: &app_runtime_env
  ENVIRONMENT: ${ENV}
  INFRA_ENVIRONMENT: ${INFRA_ENVIRONMENT:-${ENV}}
  LLM_PROVIDER: ${LLM_PROVIDER:-zai}
  S3_ENDPOINT: http://platform-s3${ENV_SUFFIX}:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://s3${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}}
  S3_BUCKET: ${S3_BUCKET:-statements}
  # An empty S3_PUBLIC_BUCKET stops finance_report at boot (#1466); it reads `s3_public_bucket or bucket`.
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-${S3_BUCKET:-statements}}
  S3_PRESIGN_EXPIRY_SECONDS: "900"
  PREFECT_API_URL: http://platform-prefect-server${ENV_SUFFIX}:4200/api
# OTEL_EXPORTER_OTLP_ENDPOINT is NOT in this anchor. It turns export ON, and the application
# refuses to start when export is on without a deployment.environment tag in
# OTEL_RESOURCE_ATTRIBUTES (staging crash-looped on 2026-09-10 when the worker got the
# endpoint alone). Each exporting service therefore names the endpoint next to its own
# issued identity: backend uses OTEL_RESOURCE_ATTRIBUTES, prefect-worker uses
# OTEL_WORKER_RESOURCE_ATTRIBUTES (#1431). The promote path issues both.

services:
  vault-agent:
    mem_limit: 128m
    init: true  # tini as PID1 reaps healthcheck ssl_client zombies
    image: hashicorp/vault:1.15
    container_name: finance_report-app-vault-agent${ENV_SUFFIX}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    entrypoint:
      - sh
      - -c
      - |
        rm -f /vault/secrets/.env /vault/.token /vault/role_id /vault/secret_id 2>/dev/null || true
        if [ -z "$$VAULT_ROLE_ID" ] || [ -z "$$VAULT_SECRET_ID" ]; then
          echo "VAULT_ROLE_ID and VAULT_SECRET_ID are required"
          exit 1
        fi
        if [ -z "$$VAULT_ADDR" ]; then
          echo "VAULT_ADDR is required"
          exit 1
        fi
        echo "$$VAULT_ROLE_ID" > /vault/role_id
        echo "$$VAULT_SECRET_ID" > /vault/secret_id
        if [ -n "$$VAULT_SECRETS_TEMPLATE" ]; then
          printf '%s' "$$VAULT_SECRETS_TEMPLATE" | base64 -d > /vault/secrets.ctmpl && [ -s /vault/secrets.ctmpl ] || { echo "CRITICAL: invalid VAULT_SECRETS_TEMPLATE"; exit 1; }
          sed 's|/etc/vault/secrets.ctmpl|/vault/secrets.ctmpl|g' /etc/vault/vault-agent.hcl > /vault/vault-agent.hcl
          exec vault agent -config=/vault/vault-agent.hcl
        fi
        # AppRole auto_auth: vault-agent logs in and renews/re-auths the token
        # natively. No token_file decay, no manual renew loop.
        exec vault agent -config=/etc/vault/vault-agent.hcl
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      VAULT_SECRETS_TEMPLATE: ${VAULT_SECRETS_TEMPLATE:-}
      ENV: ${ENV}
      # Consumed by secrets.ctmpl to template OTEL_RESOURCE_ATTRIBUTES'
      # service.version=<sha> (Infra-014). Short image sha; "unknown" fallback.
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-finance-report-backend}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      INFRA_ENVIRONMENT: ${INFRA_ENVIRONMENT:-${ENV}}
      # secrets.ctmpl is generated from the app manifest; DATABASE_URL / REDIS_URL are
      # composed with the service suffix read from this variable.
      ENV_SUFFIX: ${ENV_SUFFIX:-}
    healthcheck:
      test:
        - CMD-SHELL
        - |
          # Secrets rendered + agent token (from sink) is valid
          test -s /vault/secrets/.env && ! grep -q "<no value>" /vault/secrets/.env && test -s /vault/.token || exit 1
          # vault token lookup THROTTLED to ~5min (token TTL is hours) — no 30s hammer (#292)
          if [ -z "$$(find /tmp/.vault_hc -mmin -5 2>/dev/null)" ]; then
            wget -q -T 3 --header="X-Vault-Token: $$(cat /vault/.token)" "$$VAULT_ADDR/v1/auth/token/lookup-self" -O /dev/null || exit 1
            touch /tmp/.vault_hc
          fi
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./vault-agent.hcl:/etc/vault/vault-agent.hcl:ro
      - ./secrets.ctmpl:/etc/vault/secrets.ctmpl:ro
      - secrets:/vault/secrets
    networks:
      - dokploy-network

  backend:
    image: ghcr.io/wangzitian0/finance_report-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    container_name: finance_report-backend${ENV_SUFFIX}
    restart: always
    # ops.standards §5: fixed memory ceiling per service.
    mem_limit: 768m
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      vault-agent:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        # Ensure we're in the app directory and set PYTHONPATH for alembic
        cd /app
        export PYTHONPATH=/app

        # Wait for secrets file to be rendered by vault-agent
        echo "🔍 [CHECKPOINT-1] Waiting for Vault secrets to be rendered..."
        while [ ! -f /secrets/.env ]; do
          echo "  ⏳ Secrets not ready yet, retrying..."
          sleep 1
        done
        echo "✅ [CHECKPOINT-1] Secrets file ready at /secrets/.env"
        
        set -a
        . /secrets/.env
        set +a

        # Run database migrations with retry logic
        # Retries handle cases where PostgreSQL might not be fully ready
        # Total retry time (~50s) fits within the bounded cold-start health budget.
        echo "🔍 [CHECKPOINT-2] Starting database migrations..."
        max_retries=10
        retry_interval=5
        attempt=1

        until alembic upgrade head; do
          if [ "$$attempt" -ge "$$max_retries" ]; then
            echo "❌ [CHECKPOINT-2] CRITICAL: Migrations failed after $$attempt attempts"
            echo "  Possible causes: DB not reachable, migration syntax error, connection string wrong"
            exit 1
          fi
          echo "  ⚠️  Migration attempt $$attempt/$$max_retries failed. Retrying in $$retry_interval seconds..."
          attempt=$$((attempt + 1))
          sleep $$retry_interval
        done

        echo "✅ [CHECKPOINT-2] Migrations completed successfully"
        echo "🔍 [CHECKPOINT-3] Starting uvicorn application server on port 8000..."
        exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 120
    environment:
      DEBUG: ${DEBUG:-false}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
      # BE->OpenPanel (server-side product analytics). Same non-secret per-env
      # client-id the frontend uses (injected by deploy_primitive from
      # tools/openpanel_clients.py); empty => backend analytics is a no-op.
      OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-}
      OPENPANEL_API_URL: https://openpanel.${INTERNAL_DOMAIN}/api
      OPENPANEL_ENVIRONMENT: ${OPENPANEL_ENVIRONMENT:-}
      # Environment-specific configuration the hand-written secrets.ctmpl used to
      # default; the generated template renders only what the manifest marks human /
      # runtime, so the deployment states these here (values are the ones every
      # environment carried on 2026-09-07). Staging overrides come from
      # AppDeployer.compose_env_overrides.
      <<: *app_runtime_env
      CORS_ORIGINS: https://report${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://report${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}}
      API_RATE_LIMIT_REQUESTS: ${API_RATE_LIMIT_REQUESTS:-300}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://platform-signoz-otel-collector:4318
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-finance-report-backend}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      # Keep the fixed stack aligned with preview. A live staging cold start on
      # 2026-08-18 needed 177s before the first successful /health response.
      start_period: 450s
      interval: 30s
      retries: 3
      timeout: 5s
    volumes:
      - secrets:/secrets:ro
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-report-api${ENV_DOMAIN_SUFFIX}.rule=Host(`report${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.finance-report-api${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.finance-report-api${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.finance-report-api${ENV_DOMAIN_SUFFIX}.service=finance-report-api${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.services.finance-report-api${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=8000"
      # Strip /api prefix before forwarding to backend
      - "traefik.http.middlewares.finance-report-api-strip${ENV_DOMAIN_SUFFIX}.stripprefix.prefixes=/api"
      - "traefik.http.routers.finance-report-api${ENV_DOMAIN_SUFFIX}.middlewares=finance-report-api-strip${ENV_DOMAIN_SUFFIX}@docker"

  prefect-worker:
    # Durable-parse worker (EPIC-019). Runs the SAME promoted image as
    # `backend` (promote-not-rebuild): the dedicated "finance-report" Prefect
    # work pool is process-type (flow runs execute as plain OS processes
    # inside whichever container the worker is), so this image already has
    # the flow's code and dependencies — no separate worker image/build.
    image: ghcr.io/wangzitian0/finance_report-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    container_name: finance_report-prefect-worker${ENV_SUFFIX}
    restart: always
    # Observed 540 MiB RSS+Swap working set during prefect.engine flow execution (2026-10-27).
    mem_limit: 1g
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      vault-agent:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - scripts/prefect_worker_entrypoint.sh
    environment:
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      # Cache-bust (matching vault-agent/backend above) — without it, a same-tag
      # promote redeploy looks unchanged to Compose and this worker is never
      # recreated, so it can keep running against a stale rendered secrets file
      # (truealpha#447 was this exact gap on a different service).
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
      # The same runtime configuration the backend gets. PREFECT_API_URL is in there:
      # without it Prefect starts an ephemeral API server, times out, and this worker
      # crash-loops at ~1.5 cores per environment (2026-09-08: 71 restarts). So is
      # S3_BUCKET, whose absence here broke every staging parse (see the anchor).
      <<: *app_runtime_env
      # `:+` keeps export OFF when a deploy path issues no worker attributes (Compose
      # spec interpolation; needs Docker Compose v2.0.0 or newer, not python docker-compose 1.x).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_WORKER_RESOURCE_ATTRIBUTES:+http://platform-signoz-otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_WORKER_SERVICE_NAME:-finance-report-worker}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_WORKER_RESOURCE_ATTRIBUTES:-}
    volumes:
      - secrets:/secrets:ro
    networks:
      - dokploy-network
    # Override the backend image's baked-in HEALTHCHECK (curls :8000, the
    # API's own port) — this container runs no HTTP server, so that probe
    # always fails and the platform's breakdown-watch alerting pages
    # "critical" every cycle on a container that is actually fine (found via
    # a live Feishu alert flood, 2026-07-15). Probe the actual worker process
    # (PID 1 after the entrypoint's `exec`) instead.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          tr '\0' ' ' < /proc/1/cmdline | grep -q 'prefect worker start' || exit 1
      start_period: 60s
      interval: 30s
      retries: 3
      timeout: 5s

  frontend:
    image: ghcr.io/wangzitian0/finance_report-frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    pull_policy: always
    container_name: finance_report-frontend${ENV_SUFFIX}
    restart: always
    mem_limit: 768m
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Origin only — NO trailing /api. The front end already prefixes every
      # request path with /api (lib/api.ts), and Traefik strips that /api before
      # forwarding to the backend (see api-strip middleware above). A /api suffix
      # here would make the client build /api/api/... → 404 if this value is ever
      # baked into the bundle. The shipped image (ci.yml) deliberately bakes this
      # empty for same-origin; keeping the runtime value origin-only stays consistent.
      NEXT_PUBLIC_API_URL: https://report${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://report${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}}
      # OpenPanel PV tracking (model B: one project per env). The per-env client id
      # and environment name are injected by deploy.py as plain runtime env, read
      # server-side at request time (NOT build-time NEXT_PUBLIC, so they survive
      # the promote-not-rebuild shared image). Empty client id => a complete no-op.
      OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-}
      # Single (prod-only) OpenPanel instance — no env suffix; envs are separated
      # by project/client id (model B), not by OpenPanel instance.
      OPENPANEL_API_URL: https://openpanel.${INTERNAL_DOMAIN}/api
      OPENPANEL_ENVIRONMENT: ${OPENPANEL_ENVIRONMENT:-}
      # OpenPanel web SDK script served by the SELF-HOSTED instance (not the
      # openpanel.dev cloud CDN) so the browser loads analytics from our own domain.
      OPENPANEL_SCRIPT_URL: https://openpanel.${INTERNAL_DOMAIN}/op1.js
      # Browser → SigNoz traces (Infra-014). The browser cannot reach the
      # Docker-internal collector, so FE OTLP goes through the ONE public ingest
      # domain otel.${INTERNAL_DOMAIN} (CORS-gated + collector memory_limiter; NO
      # bearer token — a browser can't hold a secret, see ops.observability.md §4.4)
      # → Traefik → platform-signoz-otel-collector:4318. Like
      # OPENPANEL_*, these are injected as plain runtime env read server-side at
      # request time (NOT build-time NEXT_PUBLIC baked into the shared image), so a
      # promote-not-rebuild image stays env-agnostic. deployment.environment + git
      # sha mirror the backend's OTEL_RESOURCE_ATTRIBUTES so FE/BE spans correlate.
      # #368: the endpoint is built ONCE in common.deploy.env_config.otel_env (single
      # source: common.common.otel_ingest_endpoint) and injected by every deploy path
      # (deploy_primitive for staging/prod, preview_lifecycle for preview). Consumed
      # here, never re-constructed — no inline otel.<domain>/v1/traces literal. Empty
      # when unset, which config-gates the FE OTel SDK to a no-op (same as OpenPanel).
      NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: ${NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      NEXT_PUBLIC_DEPLOYMENT_ENVIRONMENT: ${ENV}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
      NEXT_PUBLIC_GIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000" ]
      start_period: 30s
      interval: 30s
      retries: 5
      timeout: 10s
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-report-web${ENV_DOMAIN_SUFFIX}.rule=Host(`report${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.finance-report-web${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.finance-report-web${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.finance-report-web${ENV_DOMAIN_SUFFIX}.service=finance-report-web${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.services.finance-report-web${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=3000"
      # Lower priority than API route
      - "traefik.http.routers.finance-report-web${ENV_DOMAIN_SUFFIX}.priority=1"

volumes:
  secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m,mode=0755"

networks:
  dokploy-network:
    external: true
