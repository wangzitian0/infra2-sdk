# Source: wangzitian0/infra2@4dd5ed29 platform/23.prefect/compose.yaml (verbatim after this line)
services:
  vault-agent:
    mem_limit: 128m
    init: true  # tini as PID1 reaps healthcheck ssl_client zombies
    image: hashicorp/vault:1.15
    container_name: platform-prefect-vault-agent${ENV_SUFFIX}
    restart: always
    entrypoint:
      - sh
      - -c
      - |
        rm -f /vault/secrets/.env /vault/.token /vault/role_id /vault/secret_id 2>/dev/null || true
        if [ -z "$$VAULT_ROLE_ID" ] || [ -z "$$VAULT_SECRET_ID" ]; then
          echo "VAULT_ROLE_ID and VAULT_SECRET_ID are required"
          exit 1
        fi
        if [ -z "$$VAULT_ADDR" ]; then
          echo "VAULT_ADDR is required"
          exit 1
        fi
        echo "$$VAULT_ROLE_ID" > /vault/role_id
        echo "$$VAULT_SECRET_ID" > /vault/secret_id
        # AppRole auto_auth: vault-agent logs in and renews/re-auths the token
        # natively. No token_file decay, no manual renew loop.
        exec vault agent -config=/etc/vault/vault-agent.hcl
    environment:
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      ENV: ${ENV}
      # Cache-bust (#628): secrets.ctmpl is a single-file bind mount, so a checkout that
      # rewrites it leaves the running agent on the old inode, and Compose only recreates
      # a service whose resolved config changed. The hash covers the template, so a
      # template edit recreates the agent instead of shipping as a silent no-op.
      CONFIGURATION_SHA256: ${CONFIGURATION_SHA256:-}
    volumes:
      - ./vault-agent.hcl:/etc/vault/vault-agent.hcl:ro
      - ./secrets.ctmpl:/etc/vault/secrets.ctmpl:ro
      - secrets:/vault/secrets
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    healthcheck:
      test:
        - CMD-SHELL
        - |
          # local checks every cycle (fast): secrets rendered + no unresolved template.
          test -s /vault/secrets/.env && ! grep -q "<no value>" /vault/secrets/.env && test -s /vault/.token || exit 1
          # vault token lookup THROTTLED to ~5min (token TTL is hours) so N vault-agents
          # do not hammer Vault every 30s (#292). The local checks above still fail fast.
          if [ -z "$$(find /tmp/.vault_hc -mmin -5 2>/dev/null)" ]; then
            wget -q -T 3 --header="X-Vault-Token: $$(cat /vault/.token)" "$$VAULT_ADDR/v1/auth/token/lookup-self" -O /dev/null || exit 1
            touch /tmp/.vault_hc
          fi
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prefect-server:
    # Pinned by digest (prefect 3.7.4 / prefect-redis 0.2.11). The :3-latest tag
    # had drifted: the host cached a Jan-2026 image with prefect-redis 0.2.8,
    # whose Redis-messaging consumer leaked ephemeral consumer groups and
    # busy-polled while idle. 0.2.11 ships the ephemeral-group cleanup + batch
    # ack. Pinning the digest stops the tag from silently going stale again.
    image: prefecthq/prefect:3-latest@sha256:c10cc349f947da083a1cfb36c031f85806befe67a285a8e54a753226ddd505ec
    container_name: platform-prefect-server${ENV_SUFFIX}
    restart: unless-stopped
    # ops.standards §5 resource governance: ceiling with headroom over observed
    # ~3G; cpu_shares scales by tier via env.
    mem_limit: 4g
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    depends_on:
      vault-agent:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        # Wait for secrets file to be rendered by vault-agent
        MAX_WAIT=60; WAITED=0
        while [ ! -f /secrets/.env ] && [ $$WAITED -lt $$MAX_WAIT ]; do
          echo "Waiting for secrets... ($$WAITED/$$MAX_WAIT)"
          sleep 2
          WAITED=$$((WAITED+2))
        done
        [ -f /secrets/.env ] || { echo "FATAL: Secrets timeout after $${MAX_WAIT}s. Check vault-agent logs."; exit 1; }
        set -a
        . /secrets/.env
        set +a
        # Construct DATABASE_URL with password from secrets
        export PREFECT_API_DATABASE_CONNECTION_URL="postgresql+asyncpg://postgres:$${POSTGRES_PASSWORD}@platform-postgres${ENV_SUFFIX}:5432/prefect"
        export PREFECT_REDIS_MESSAGING_PASSWORD="$${REDIS_PASSWORD}"
        exec prefect server start --no-services
    environment:
      ENV_SUFFIX: ${ENV_SUFFIX}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      # Enable flow_runs + orphaned logs vacuum alongside default events (#1694/ops hygiene).
      PREFECT_SERVER_SERVICES_DB_VACUUM_ENABLED: "events,flow_runs"
      PREFECT_SERVER_SERVICES_DB_VACUUM_RETENTION_PERIOD: "14 days"
      # Redis messaging
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: platform-redis${ENV_SUFFIX}
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 1
    volumes:
      - secrets:/secrets:ro
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      # SSO-protected access via Authentik forward auth
      # Env-scoped router/service/middleware names + host so staging and
      # production do not collide on the same Traefik route, and so staging's
      # forward-auth targets the staging Authentik (not prod). Matches the
      # platform/21.portal pattern. ${ENV_DOMAIN_SUFFIX} is empty in production
      # (URL unchanged) and "-staging" elsewhere.
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.rule=Host(`prefect${ENV_DOMAIN_SUFFIX}.${INTERNAL_DOMAIN}`)"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.entrypoints=websecure"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.tls=true"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.service=prefect${ENV_DOMAIN_SUFFIX}"
      - "traefik.http.services.prefect${ENV_DOMAIN_SUFFIX}.loadbalancer.server.port=4200"
      # Authentik forward auth middleware (env-scoped name + target)
      - "traefik.http.middlewares.prefect-auth${ENV_DOMAIN_SUFFIX}.forwardauth.address=http://platform-authentik-server${ENV_SUFFIX}:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.prefect-auth${ENV_DOMAIN_SUFFIX}.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.prefect-auth${ENV_DOMAIN_SUFFIX}.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"
      - "traefik.http.routers.prefect${ENV_DOMAIN_SUFFIX}.middlewares=prefect-auth${ENV_DOMAIN_SUFFIX}@docker"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://localhost:4200/api/health', timeout=1).read().strip() == b'true' else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    # Pinned by digest (prefect 3.7.4 / prefect-redis 0.2.11). The :3-latest tag
    # had drifted: the host cached a Jan-2026 image with prefect-redis 0.2.8,
    # whose Redis-messaging consumer leaked ephemeral consumer groups and
    # busy-polled while idle. 0.2.11 ships the ephemeral-group cleanup + batch
    # ack. Pinning the digest stops the tag from silently going stale again.
    image: prefecthq/prefect:3-latest@sha256:c10cc349f947da083a1cfb36c031f85806befe67a285a8e54a753226ddd505ec
    container_name: platform-prefect-services${ENV_SUFFIX}
    restart: unless-stopped
    mem_limit: 1g
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    depends_on:
      prefect-server:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        # Wait for secrets file
        MAX_WAIT=60; WAITED=0
        while [ ! -f /secrets/.env ] && [ $$WAITED -lt $$MAX_WAIT ]; do
          echo "Waiting for secrets... ($$WAITED/$$MAX_WAIT)"
          sleep 2
          WAITED=$$((WAITED+2))
        done
        [ -f /secrets/.env ] || { echo "FATAL: Secrets timeout after $${MAX_WAIT}s. Check vault-agent logs."; exit 1; }
        set -a
        . /secrets/.env
        set +a
        # Construct DATABASE_URL with password from secrets
        export PREFECT_API_DATABASE_CONNECTION_URL="postgresql+asyncpg://postgres:$${POSTGRES_PASSWORD}@platform-postgres${ENV_SUFFIX}:5432/prefect"
        export PREFECT_REDIS_MESSAGING_PASSWORD="$${REDIS_PASSWORD}"
        exec prefect server services start
    environment:
      ENV_SUFFIX: ${ENV_SUFFIX}
      # Prefect 3 defaults DB_VACUUM_ENABLED to {"events"} only, leaving flow_runs and logs unpruned.
      PREFECT_SERVER_SERVICES_DB_VACUUM_ENABLED: "events,flow_runs"
      PREFECT_SERVER_SERVICES_DB_VACUUM_RETENTION_PERIOD: "14 days"
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: platform-redis${ENV_SUFFIX}
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 1
    volumes:
      - secrets:/secrets:ro
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      # #163/#531: prefect-services runs prefect's background service loops
      # (scheduler/foreman/cancellation-cleanup/late-runs/etc, all ticking every
      # 5-60s per `prefect.settings...server.services`) with NO HTTP port and NO
      # live-status CLI surface -- `prefect server services ls` only dumps
      # static enabled/disabled config from settings, not whether the running
      # loops are actually ticking (verified against the installed prefect 3.7.4
      # CLI). A log-freshness heartbeat was considered and ruled out: this
      # container's own logs showed a genuine 7-day silent gap between lines
      # while idle and healthy (verified live), so any "logged in the last N
      # minutes" threshold would false-positive during ordinary quiet periods --
      # exactly the sparse-logging trap #531 is about. The best real signal
      # available is an ACTIVE, per-check network round-trip (fresh TCP connect,
      # not a passive read of already-open sockets) from this container's own
      # network namespace to both hard dependencies every one of those loops
      # needs: Postgres (state) and Redis (messaging). This does not prove the
      # asyncio loops aren't wedged -- no such probe exists for this role -- but
      # it catches container-specific DNS/network-partition failures that
      # Docker's bare `state=running` never would, and it is strictly more
      # meaningful than a `pgrep`-style liveness check (which running already
      # covers).
      test:
        - CMD-SHELL
        - |
          python -c "
          import socket, sys
          targets = [('platform-redis${ENV_SUFFIX}', 6379), ('platform-postgres${ENV_SUFFIX}', 5432)]
          bad = []
          for host, port in targets:
              try:
                  socket.create_connection((host, port), timeout=3).close()
              except OSError:
                  bad.append(host)
          sys.exit(1 if bad else 0)
          "
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-worker:
    # Pinned by digest (prefect 3.7.4 / prefect-redis 0.2.11). The :3-latest tag
    # had drifted: the host cached a Jan-2026 image with prefect-redis 0.2.8,
    # whose Redis-messaging consumer leaked ephemeral consumer groups and
    # busy-polled while idle. 0.2.11 ships the ephemeral-group cleanup + batch
    # ack. Pinning the digest stops the tag from silently going stale again.
    image: prefecthq/prefect:3-latest@sha256:c10cc349f947da083a1cfb36c031f85806befe67a285a8e54a753226ddd505ec
    container_name: platform-prefect-worker${ENV_SUFFIX}
    restart: on-failure
    mem_limit: 1g
    cpu_shares: ${TIER_CPU_SHARES:-1024}
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://platform-prefect-server${ENV_SUFFIX}:4200/api
    command: prefect worker start --pool default
    networks:
      - dokploy-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      # #163/#531: a `pgrep`-style "is the process alive" check would be a WEAK
      # signal -- Docker's own `state=running` already covers "the process
      # didn't exit." A real check needs to prove the worker can actually do
      # its job: poll the Prefect API to pick up work. This reads the work pool
      # over HTTP (`GET $PREFECT_API_URL/work_pools/<pool>`, the same endpoint
      # the `prefect work-pool inspect` CLI wraps) and requires
      # `status == READY`. prefect-server's own Foreman service loop (in
      # platform-prefect-services, ticking every 15s) marks a work pool
      # NOT_READY as soon as it has no worker with a recent heartbeat, so
      # `status == READY` is a live proxy for "this worker's heartbeat is
      # current," not just "the API answered." Together this catches: API/DNS
      # unreachable, the pool/queue deleted or misconfigured, and (via
      # Foreman's heartbeat bookkeeping) this worker having stopped polling --
      # none of which `state=running` or a process-existence check would catch.
      #
      # #961: do NOT spawn the `prefect` CLI here. Measured in this container,
      # `prefect work-pool inspect` took 7.7-10.3s (it imports the whole prefect
      # package) against an 8s subprocess timeout every 30s, so the probe itself
      # flapped the container unhealthy and burned ~70% of a core per run. The
      # urllib read answers in ~0.3s. Keep the urlopen timeout (3s) below the
      # docker `timeout` (10s). The pool name must stay equal to `--pool` in
      # `command` above (pinned by common/tests/test_prefect_worker_healthcheck.py).
      # Any error, timeout, non-JSON body, or status other than READY exits 1.
      test:
        - CMD-SHELL
        - |
          python -c "
          import json, os, sys, urllib.request
          try:
              url = os.environ['PREFECT_API_URL'].rstrip('/') + '/work_pools/default'
              with urllib.request.urlopen(url, timeout=3) as resp:
                  status = json.load(resp).get('status')
          except Exception:
              sys.exit(1)
          sys.exit(0 if status == 'READY' else 1)
          "
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  secrets:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m,mode=0755"

networks:
  dokploy-network:
    external: true
