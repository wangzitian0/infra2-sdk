# Single source of truth for cross-repository shared environment variable names.
schema_version: 2
groups:
  runtime:
    - name: ENVIRONMENT
      sensitive: false
    - name: SERVICE_VERSION
      sensitive: false
    - name: GIT_COMMIT_SHA
      sensitive: false
    - name: IMAGE_DIGEST
      sensitive: false
    - name: CONFIGURATION_SHA256
      sensitive: false
    - name: RELEASE_ID
      sensitive: false
    - name: OTEL_SERVICE_NAME
      sensitive: false
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      sensitive: false
    - name: OTEL_RESOURCE_ATTRIBUTES
      sensitive: false
  postgres_redis:
    - name: DATABASE_URL
      sensitive: true
    - name: REDIS_URL
      sensitive: true
  s3:
    - name: S3_ENDPOINT
      sensitive: false
    - name: S3_BUCKET
      sensitive: false
    - name: S3_ACCESS_KEY
      sensitive: true
    - name: S3_SECRET_KEY
      sensitive: true
    - name: S3_REGION
      sensitive: false
      # Public origin for browser presigned URLs.
    - name: S3_PUBLIC_ENDPOINT
      sensitive: false
  llm:
    - name: LLM_PROVIDER
      sensitive: false
    - name: LLM_BASE_URL
      sensitive: false
    - name: LLM_API_KEY
      sensitive: true
    - name: LLM_LARGE_MODEL
      sensitive: false
    - name: LLM_SMALL_MODEL
      sensitive: false
    - name: LLM_MULTIMODAL_MODEL
      sensitive: false
  frontend_telemetry:
    - name: NEXT_PUBLIC_APP_URL
      sensitive: false
    - name: NEXT_PUBLIC_API_URL
      sensitive: false
    - name: NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT
      sensitive: false
    - name: NEXT_PUBLIC_DEPLOYMENT_ENVIRONMENT
      sensitive: false
    - name: NEXT_PUBLIC_GIT_SHA
      sensitive: false
    - name: OPENPANEL_API_URL
      sensitive: false
    - name: OPENPANEL_CLIENT_ID
      sensitive: false
    - name: OPENPANEL_ENVIRONMENT
      sensitive: false
    - name: OPENPANEL_SCRIPT_URL
      sensitive: false
