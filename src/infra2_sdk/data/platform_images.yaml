# Deprecated since infra2-sdk 2.4.0 (module infra2_sdk.images, removed in 3.0.0).
# Not kept in sync with infra2's compose pins, which are the source of truth. The minio and
# mc entries were removed: infra2 no longer runs MinIO (object storage is RustFS, built from
# platform/03.s3), and no correct replacement digest is published for this catalog.
schema_version: 1
images:
  postgres:
    image: "postgres:16-alpine"
    recommended_mem_limit: "512m"
    summary: "PostgreSQL database server"
  redis:
    image: "redis:7-alpine"
    recommended_mem_limit: "256m"
    summary: "Redis in-memory cache and message store"
  vault_agent:
    image: "hashicorp/vault:1.15"
    recommended_mem_limit: "128m"
    summary: "HashiCorp Vault agent sidecar for AppRole auth and secrets rendering"
