[project]
name = "infra2-sdk"
version = "4.8.1"
description = "Portable environment contracts and standard-protocol runtime adapters"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Zitian Wang" },
]
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
s3 = [
    "boto3>=1.34,<2",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
otel = [
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
    "opentelemetry-instrumentation-logging>=0.45b0,<1",
]
http = [
    "httpx>=0.27,<1",
]
fastapi = [
    "fastapi>=0.162,<1",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
    "opentelemetry-instrumentation-logging>=0.45b0,<1",
]
pydantic-ai = [
    "pydantic-ai-slim[zai]>=2.71.0,<3",
]
all = [
    "boto3>=1.34,<2",
    "fastapi>=0.162,<1",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
    "opentelemetry-instrumentation-logging>=0.45b0,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-ai-slim[zai]>=2.71.0,<3",
]
dev = [
    "boto3>=1.34,<2",
    "build>=1.2,<2,!=1.5.1",
    "fastapi>=0.162,<1",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
    "opentelemetry-instrumentation-logging>=0.45b0,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-ai-slim[zai]>=2.71.0,<3",
    "pydantic-settings>=2.2,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    "pytest-recording>=0.15,<1",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infra2_sdk = ["data/*.yaml", "py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
empty_parameter_set_mark = "fail_at_collect"

[tool.coverage.run]
branch = true
source = ["infra2_sdk"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Moved verbatim from infra2 common/tests (#239): long docstrings that name incidents.
"tests/test_schema_check.py" = ["E501"]
"tests/test_schema_check_new_tables.py" = ["E501"]
# Canary Todo moved verbatim from infra2 (#247): long SQL and HTML literals, FastAPI Body() defaults.
"canary/todo/app.py" = ["E501", "B008", "SIM117"]
"canary/todo/ui.py" = ["E501"]
"canary/todo/tests/test_canary_depth.py" = ["E501"]
