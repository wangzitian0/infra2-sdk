name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git update-ref refs/remotes/origin/main FETCH_HEAD
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term-missing
      - run: python -m build
      - name: Smoke-test release wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          for extra in core s3 postgres http otel all; do
            venv=".wheel-smoke-${extra}"
            python -m venv "$venv"
            if [ "$extra" = core ]; then
              spec="$wheel"
            else
              spec="${wheel}[${extra}]"
            fi
            "$venv/bin/python" -m pip install "$spec"
            "$venv/bin/python" tests/wheel_smoke.py "$extra"
            "$venv/bin/python" -m pip check
          done
      - name: Publish immutable GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
