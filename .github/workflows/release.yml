name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git update-ref refs/remotes/origin/main FETCH_HEAD
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Verify CI passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --status success --json databaseId --jq length)"
          test "$passed" -ge 1
      - run: python -m pip install build
      - run: python -m build
      - name: Publish immutable GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag

  canary-todo-image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/infra2-canary-todo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Canary Todo image from the tagged source
        run: docker build -f canary/todo/Dockerfile -t "$IMAGE:$GITHUB_REF_NAME" .
      - name: The image runs the tagged SDK version
        run: scripts/check_canary_image_sdk.sh "$IMAGE:$GITHUB_REF_NAME"
      - name: Push and print the digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$GITHUB_REF_NAME"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_REF_NAME")"
          echo "canary image: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
