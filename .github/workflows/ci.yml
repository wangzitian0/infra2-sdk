name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify version bump and unused tag when src/infra2_sdk changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          git update-ref refs/remotes/origin/main FETCH_HEAD
          git fetch origin --tags --force
          changed="$(git diff --name-only origin/main...HEAD -- src/infra2_sdk/)"
          if [ -z "$changed" ]; then
            echo "No changes under src/infra2_sdk/; skipping version-bump gate."
            exit 0
          fi
          head_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          base_version="$(git show origin/main:pyproject.toml | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          if [ "$head_version" = "$base_version" ]; then
            echo "ERROR: src/infra2_sdk/ changed relative to origin/main, but pyproject.toml version ($head_version) equals origin/main ($base_version)." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${head_version}" >/dev/null; then
            echo "ERROR: git tag v${head_version} already exists." >&2
            exit 1
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term-missing
      - run: python -m build

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  extras-smoke:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        extra: [core, s3, postgres, http, otel, fastapi, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - name: Smoke-test ${{ matrix.extra }} wheel install
        run: |
          python -m venv .wheel-smoke
          wheel="$(find dist -name '*.whl' -print -quit)"
          if [ "${{ matrix.extra }}" = core ]; then
            spec="$wheel"
          else
            spec="${wheel}[${{ matrix.extra }}]"
          fi
          .wheel-smoke/bin/python -m pip install "$spec"
          .wheel-smoke/bin/python tests/wheel_smoke.py "${{ matrix.extra }}"
          .wheel-smoke/bin/python -m pip check
